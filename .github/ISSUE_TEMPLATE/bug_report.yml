name: Bug report
description: Something doesn't work as documented
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. If you found a way around the approval gate or the confirmation prompts, please **don't** file it here. Report it privately as described in the [security policy](https://github.com/surajyadavofficial01may/jira-fixer-kit/security/policy).
  - type: dropdown
    id: editor
    attributes:
      label: Editor
      options:
        - Claude Code
        - VS Code (GitHub Copilot)
        - Other
    validations:
      required: true
  - type: input
    id: versions
    attributes:
      label: Versions
      description: Plugin version, editor version, Node version (`node --version`), and OS.
      placeholder: jira-fixer 1.3.0, Claude Code 2.1.314, Node 22.11, Windows 11
    validations:
      required: true
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Run /jira-fix PROJ-1234
        2. Click Approve
        3. ...
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant output
      description: The agent's messages, and lines from `.jira-fixer/audit.log` or `node <plugin>/skills/jira-fix/scripts/gate.js status`. Remove ticket content, secrets, and personal data.
      render: text
